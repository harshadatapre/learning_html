<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- direction - left, right, up, down -->
    <marquee direction="rigth" bgcolor="yellow">Welcome of FCT</marquee>
    <marquee direction="up" bgcolor="yellow" height="200">Welcome of FCT</marquee>

    <!-- behavior - scroll, alternate, slide -->
    <marquee behavior="alternate" direction="rigth" bgcolor="yellow" height="20">Welcome of FCT</marquee>

    <marquee behavior="alternate" direction="alternate" bgcolor="yellow" height="20" scrollamount="2">Welcome of FCT</marquee>
    <marquee behavior="alternate" direction="alternate" bgcolor="yellow" height="20"  scrollamount="30">Welcome of FCT</marquee>
</body>
</html>
